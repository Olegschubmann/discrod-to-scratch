<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Discord Activity</title>
    <style>
        :root {
            --bg-color: #313338;
            --panel-color: #2b2d31;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --text-color: #dbdee1;
            --input-bg: #1e1f22;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'GG Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Obere Steuerungsleiste im Discord-Look */
        .control-bar {
            padding: 12px 20px;
            background-color: var(--panel-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        input[type="text"] {
            background-color: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 4px;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            width: 220px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Spiel-Bereich */
        .player-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px);
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Platzhalter, wenn noch kein Spiel geladen ist */
        .placeholder {
            text-align: center;
            color: #80848e;
        }

        .placeholder h2 {
            margin-bottom: 8px;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="control-bar">
        <input type="text" id="projectId" placeholder="Scratch Projekt-ID (z.B. 87619272)" value="87619272">
        <button onclick="loadGame()">Spiel starten</button>
    </div>

    <div class="player-container" id="container">
        <div class="placeholder" id="placeholder">
            <h2>Kein Spiel geladen</h2>
            <p>Gib oben eine Scratch-ID ein und klicke auf "Spiel starten".</p>
        </div>
    </div>

    <script>
        function loadGame() {
            const id = document.getElementById('projectId').value.trim();
            const container = document.getElementById('container');
            
            if (!id) {
                alert("Bitte gib eine gültige Projekt-ID ein!");
                return;
            }

            // Container leeren und das TurboWarp-Iframe sauber einbetten
            container.innerHTML = `
                <iframe 
                    src="https://turbowarp.org/${id}/embed?autoplay" 
                    allowfullscreen 
                    allow="autoplay; encrypted-media; fullscreen"
                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                </iframe>
            `;
        }

        // Optional: Direkt beim Laden das Standard-Spiel (aus dem Input-Feld) starten
        window.onload = function() {
            loadGame();
        };
    </script>
</body>
</html>
